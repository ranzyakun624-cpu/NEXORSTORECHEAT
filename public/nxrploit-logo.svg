<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">NXRPLOIT — The Universe Keeper</title>
  <desc id="desc">Siluet iblis hitam bertanduk memegang bola kosmik bercahaya.</desc>
